[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[images]
  remote_images = ["https:\\/\\/[a-z0-9.-]+\\.steamstatic\\.com\\/.*"]

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"
    fail_deploy_on_score_thresholds = "false"

  [plugins.inputs.thresholds]
    performance = 0.9
    accessibility = 0.9
    best-practices = 0.9
    seo = 0.9

  [[plugins.inputs.audits]]
    path = "index.html"

  [[plugins.inputs.audits]]
    path = "kalkulator.html"

  [[plugins.inputs.audits]]
    path = "skins.html"

  [[plugins.inputs.audits]]
    path = "poradniki.html"

  [[plugins.inputs.audits]]
    path = "porownaj.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
